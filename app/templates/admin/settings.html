{% extends "base.html" %}
{% block title %}Settings — Banking DSA CRM{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">System Settings</h1>
</div>

<div class="card-neu max-w-xl">
    <form method="POST" action="{{ url_for('admin.settings') }}" novalidate>
        {{ form.hidden_tag() }}
        <div class="form-group"><label class="form-label">Agency Name</label><input type="text" name="agency_name" class="form-control" value="{{ form.agency_name.data or '' }}"></div>
        <div class="form-group"><label class="form-label">Agency GSTIN</label><input type="text" name="agency_gstin" class="form-control" value="{{ form.agency_gstin.data or '' }}"></div>
        <div class="form-group"><label class="form-label">Agency Address</label><textarea name="agency_address" class="form-control" rows="3">{{ form.agency_address.data or '' }}</textarea></div>
        <button type="submit" class="btn-primary w-full justify-center btn-ripple"><i data-lucide="save" class="w-4 h-4"></i> Save Settings</button>
    </form>
</div>
{% endblock %}
