{# Template scaffold for Phase 2 frontend architecture. #}
{% extends 'layouts/base.html' %}
{% block title %}Forgot Password | Banking DSA AI CRM{% endblock %}

{% block content %}
<section class="form-shell">
  <article class="neu-card p-4 p-md-5">
    <h1 class="h3 mb-2">Forgot password</h1>
    <p class="mb-4">Enter your account email to receive reset instructions.</p>

    <form class="needs-validation" novalidate>
      <div class="mb-3">
        <input class="neu-input" type="email" placeholder="name@company.com" required>
      </div>
      <button type="submit" class="btn btn-primary rounded-pill px-4">Send Reset Link</button>
    </form>
  </article>
</section>
{% endblock %}
