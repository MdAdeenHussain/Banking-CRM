{% extends "base.html" %}
{% block title %}Forgot Password — Banking DSA CRM{% endblock %}

{% block auth_content %}
<div class="auth-card animate__animated animate__fadeIn">
    <div class="auth-logo">
        <h1>Reset Password</h1>
        <p>Enter your email to receive a reset link</p>
    </div>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}" novalidate>
        {{ form.hidden_tag() }}
        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" name="email" id="email" class="form-control"
                placeholder="you@company.com" autofocus required>
        </div>
        <button type="submit" class="btn-primary w-full justify-center py-3 btn-ripple">Send Reset Link</button>
    </form>

    <div class="text-center mt-4">
        <a href="{{ url_for('auth.login') }}" class="text-sm" style="color:var(--text-secondary);">
            ← Back to Sign In
        </a>
    </div>
</div>
{% endblock %}
