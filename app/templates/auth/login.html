{# Template scaffold for Phase 2 frontend architecture. #}
{% extends 'layouts/base.html' %}
{% block title %}Login | Banking DSA AI CRM{% endblock %}

{% block content %}
<section class="form-shell">
  <article class="neu-card p-4 p-md-5">
    <h1 class="h3 mb-2">Sign in to your workspace</h1>
    <p class="mb-4">Access your tenant dashboard, lead pipeline, and branch analytics.</p>

    <form class="needs-validation" novalidate>
      <div class="mb-3">
        <label class="form-label small">Tenant Slug</label>
        <input class="neu-input" type="text" placeholder="your-tenant" required>
      </div>
      <div class="mb-3">
        <label class="form-label small">Email</label>
        <input class="neu-input" type="email" placeholder="name@company.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label small">Password</label>
        <input class="neu-input" type="password" placeholder="********" required>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember-me">
          <label class="form-check-label small" for="remember-me">Remember me</label>
        </div>
        <a href="#" class="small">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary w-100 rounded-pill">Login</button>
    </form>
  </article>
</section>
{% endblock %}
