{% extends "base.html" %}
{% block title %}Verify OTP — Banking DSA CRM{% endblock %}

{% block auth_content %}
<div class="auth-card animate__animated animate__fadeIn">
    <div class="auth-logo">
        <h1>Verify Identity</h1>
        <p>Enter the 6-digit code sent to {{ user_email }}</p>
    </div>

    <form method="POST" action="{{ url_for('auth.otp_verify') }}" novalidate>
        {{ form.hidden_tag() }}
        <div class="form-group">
            <label class="form-label" for="otp">Verification Code</label>
            <input type="text" name="otp" id="otp" maxlength="6" pattern="\d{6}"
                class="form-control text-center text-2xl tracking-widest {{ 'is-invalid' if form.otp.errors }}"
                placeholder="000000" autofocus required style="letter-spacing:0.5em;font-family:var(--font-mono);">
            {% for error in form.otp.errors %}
            <div class="invalid-feedback">{{ error }}</div>
            {% endfor %}
        </div>
        <button type="submit" class="btn-primary w-full justify-center py-3 btn-ripple">Verify & Sign In</button>
    </form>

    <div class="text-center mt-4">
        <form method="POST" action="{{ url_for('auth.resend_otp') }}" class="inline">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="text-sm font-medium" style="background:none;border:none;color:var(--primary);cursor:pointer;">
                Resend Code
            </button>
        </form>
    </div>
</div>
{% endblock %}
