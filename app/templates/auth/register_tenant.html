{# Template scaffold for Phase 2 frontend architecture. #}
{% extends 'layouts/base.html' %}
{% block title %}Register Tenant | Banking DSA AI CRM{% endblock %}

{% block content %}
<section class="form-shell">
  <article class="neu-card p-4 p-md-5">
    <h1 class="h3 mb-2">Create your tenant workspace</h1>
    <p class="mb-4">Set up your DSA organization and start onboarding your team.</p>

    <form class="needs-validation" novalidate>
      <div class="row g-3">
        <div class="col-12"><input class="neu-input" type="text" placeholder="DSA Organization Name" required></div>
        <div class="col-12"><input class="neu-input" type="text" placeholder="Tenant Slug (example: urban-dsa)" required></div>
        <div class="col-12 col-md-6"><input class="neu-input" type="email" placeholder="Admin Email" required></div>
        <div class="col-12 col-md-6"><input class="neu-input" type="tel" placeholder="Admin Phone"></div>
        <div class="col-12"><input class="neu-input" type="password" placeholder="Create Password" required></div>
      </div>
      <button type="submit" class="btn btn-primary rounded-pill px-4 mt-3">Register Tenant</button>
    </form>
  </article>
</section>
{% endblock %}
