{# Template scaffold for Phase 2 frontend architecture. #}
{% extends 'layouts/base.html' %}
{% block title %}Reset Password | Banking DSA AI CRM{% endblock %}

{% block content %}
<section class="form-shell">
  <article class="neu-card p-4 p-md-5">
    <h1 class="h3 mb-2">Set a new password</h1>
    <p class="mb-4">Use a strong password with letters, numbers, and symbols.</p>

    <form class="needs-validation" novalidate>
      <div class="mb-3"><input class="neu-input" type="password" placeholder="New Password" required></div>
      <div class="mb-3"><input class="neu-input" type="password" placeholder="Confirm Password" required></div>
      <button type="submit" class="btn btn-primary rounded-pill px-4">Update Password</button>
    </form>
  </article>
</section>
{% endblock %}
