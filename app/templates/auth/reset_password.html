{% extends "base.html" %}
{% block title %}Reset Password — Banking DSA CRM{% endblock %}

{% block auth_content %}
<div class="auth-card animate__animated animate__fadeIn">
    <div class="auth-logo">
        <h1>Set New Password</h1>
        <p>Choose a strong password for your account</p>
    </div>

    <form method="POST"
        action="{{ url_for('auth.reset_password', token=token, email=email) }}" novalidate>
        {{ form.hidden_tag() }}
        <div class="form-group">
            <label class="form-label" for="password">New Password</label>
            <input type="password" name="password" id="password"
                class="form-control {{ 'is-invalid' if form.password.errors }}" placeholder="Min 8 characters" required>
            {% for error in form.password.errors %}
            <div class="invalid-feedback">{{ error }}</div>
            {% endfor %}
        </div>
        <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm New Password</label>
            <input type="password" name="confirm_password" id="confirm_password"
                class="form-control" placeholder="Re-enter" required>
        </div>
        <button type="submit" class="btn-primary w-full justify-center py-3 btn-ripple">Reset Password</button>
    </form>
</div>
{% endblock %}
