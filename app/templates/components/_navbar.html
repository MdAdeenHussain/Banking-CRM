<!-- Top Navigation Bar -->
<header class="bg-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex items-center justify-between">
        <!-- Left side: Breadcrumb/Title -->
        <div>
            <h2 class="text-2xl font-bold text-gray-900">
                {% block page_title %}Dashboard{% endblock %}
            </h2>
            <p class="mt-1 text-sm text-gray-600">
                {% block page_subtitle %}Welcome to your CRM dashboard{% endblock %}
            </p>
        </div>
        
        <!-- Right side: Actions & Profile -->
        <div class="flex items-center space-x-4">
            <!-- Notifications -->
            <div class="relative">
                <button class="relative p-2 text-gray-600 hover:text-gray-900">
                    <i class="fas fa-bell h-6 w-6"></i>
                    <span class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-red-600 rounded-full">3</span>
                </button>
            </div>
            
            <!-- User Dropdown -->
            <div class="relative" id="user-menu">
                <button class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-100">
                    <img src="https://ui-avatars.com/api/?name={{ current_user.first_name }}+{{ current_user.last_name }}&background=random" 
                         alt="Profile" class="h-8 w-8 rounded-full">
                    <span class="text-sm font-medium text-gray-900">{{ current_user.first_name }}</span>
                    <i class="fas fa-chevron-down h-4 w-4 text-gray-600"></i>
                </button>
                
                <!-- Dropdown Menu -->
                <div class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg z-50">
                    <a href="{{ url_for('auth.profile') }}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</a>
                    <a href="{{ url_for('auth.change_password') }}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Change Password</a>
                    <hr>
                    <a href="{{ url_for('auth.logout') }}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Logout</a>
                </div>
            </div>
        </div>
    </div>
</header>
