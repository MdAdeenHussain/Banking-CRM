<!-- Sidebar Navigation -->
<aside class="hidden md:flex md:flex-col md:w-64 md:bg-indigo-700 md:text-white">
    <div class="flex items-center justify-center h-16 bg-indigo-900 px-4">
        <h1 class="text-xl font-bold">LoanCRM</h1>
    </div>
    
    <nav class="flex-1 px-2 py-4 space-y-2">
        <!-- Dashboard -->
        <a href="{{ url_for('dashboard.owner_dashboard') }}" 
           class="group flex items-center px-4 py-2 text-sm font-medium rounded-lg {% if request.endpoint == 'dashboard.owner_dashboard' %}bg-indigo-600{% else %}hover:bg-indigo-600{% endif %}">
            <i class="fas fa-chart-bar mr-3 h-5 w-5"></i>
            Dashboard
        </a>
        
        <!-- Leads -->
        <button class="group w-full flex items-center px-4 py-2 text-sm font-medium rounded-lg hover:bg-indigo-600 collapsed"
                data-toggle="leads-menu">
            <i class="fas fa-users mr-3 h-5 w-5"></i>
            Leads
            <i class="fas fa-chevron-right ml-auto h-4 w-4 transform transition-transform"></i>
        </button>
        <div id="leads-menu" class="hidden pl-4 space-y-1">
            <a href="{{ url_for('leads.list_leads') }}" 
               class="block px-4 py-2 text-sm rounded-lg hover:bg-indigo-600">List Leads</a>
            <a href="{{ url_for('leads.create_lead') }}" 
               class="block px-4 py-2 text-sm rounded-lg hover:bg-indigo-600">New Lead</a>
        </div>
        
        <!-- Customers -->
        <button class="group w-full flex items-center px-4 py-2 text-sm font-medium rounded-lg hover:bg-indigo-600 collapsed"
                data-toggle="customers-menu">
            <i class="fas fa-id-card mr-3 h-5 w-5"></i>
            Customers
            <i class="fas fa-chevron-right ml-auto h-4 w-4 transform transition-transform"></i>
        </button>
        <div id="customers-menu" class="hidden pl-4 space-y-1">
            <a href="{{ url_for('customers.list_customers') }}" 
               class="block px-4 py-2 text-sm rounded-lg hover:bg-indigo-600">View Customers</a>
        </div>
        
        <!-- Settings (for admin) -->
        {% if 'tenant_admin' in g.user_roles or 'admin' in g.user_roles %}
        <a href="{{ url_for('settings.index') }}" 
           class="group flex items-center px-4 py-2 text-sm font-medium rounded-lg hover:bg-indigo-600">
            <i class="fas fa-cog mr-3 h-5 w-5"></i>
            Settings
        </a>
        {% endif %}
    </nav>
    
    <!-- User Profile Section -->
    <div class="p-4 border-t border-indigo-600">
        <div class="flex items-center">
            <div class="flex-1 min-w-0">
                <p class="text-sm font-medium truncate">{{ current_user.first_name }} {{ current_user.last_name }}</p>
                <p class="text-xs text-indigo-300 truncate">{{ current_user.email }}</p>
            </div>
        </div>
        <a href="{{ url_for('auth.logout') }}" 
           class="mt-3 block px-4 py-2 text-sm text-center rounded-lg bg-indigo-600 hover:bg-indigo-500 transition">
            Logout
        </a>
    </div>
</aside>

<!-- Mobile Menu Button (visible on small screens) -->
<div class="md:hidden fixed top-0 right-0 z-50">
    <button id="mobile-menu-btn" class="m-4 p-2 rounded-lg bg-indigo-700 text-white">
        <i class="fas fa-bars h-6 w-6"></i>
    </button>
</div>
