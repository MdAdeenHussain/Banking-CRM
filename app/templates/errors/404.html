{% extends "base.html" %}
{% block title %}404 — Page Not Found{% endblock %}

{% block content %}
<div class="flex items-center justify-center" style="min-height:60vh;">
    <div class="text-center">
        <div class="text-6xl font-bold font-display mb-4" style="color:var(--primary);">404</div>
        <h1 class="text-xl font-semibold mb-2">Page Not Found</h1>
        <p class="text-gray-500 mb-6">The page you're looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn-primary btn-ripple">
            <i data-lucide="home" class="w-4 h-4"></i> Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}

{% block auth_content %}
<div class="auth-card text-center">
    <div class="text-6xl font-bold font-display mb-4" style="color:var(--primary);">404</div>
    <h1 class="text-xl font-semibold mb-2">Page Not Found</h1>
    <a href="{{ url_for('auth.login') }}" class="btn-primary btn-ripple">Sign In</a>
</div>
{% endblock %}
