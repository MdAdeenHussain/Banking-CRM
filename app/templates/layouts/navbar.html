<!-- Navigation Bar -->
<nav class="navbar">
    <div class="navbar-container">
        <!-- Logo -->
        <div class="navbar-brand">
            <a href="/dashboard" class="logo">
                <i class="fas fa-landmark"></i>
                <span>DSA CRM</span>
            </a>
        </div>
        
        <!-- Search Bar (Centered) -->
        <div class="navbar-search">
            <input type="text" class="search-input" placeholder="Search leads, customers..." id="globalSearch">
            <button class="search-btn"><i class="fas fa-search"></i></button>
        </div>
        
        <!-- Right Side Icons -->
        <div class="navbar-right">
            <!-- Notifications -->
            <div class="notification-bell">
                <button class="btn-icon" id="notificationBell">
                    <i class="fas fa-bell"></i>
                    <span class="badge" id="notificationCount">0</span>
                </button>
                <div class="notification-dropdown" id="notificationDropdown" style="display: none;">
                    <div class="notification-list" id="notificationList">
                        <p class="empty-message">No notifications</p>
                    </div>
                </div>
            </div>
            
            <!-- User Profile Dropdown -->
            <div class="user-menu">
                <button class="btn-user" id="userMenuBtn">
                    <img src="https://via.placeholder.com/40" alt="User Avatar" class="avatar">
                    <span class="user-name">{{ current_user.full_name if current_user else 'User' }}</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="dropdown-menu" id="userDropdown" style="display: none;">
                    <a href="/profile" class="dropdown-item">
                        <i class="fas fa-user"></i> Profile
                    </a>
                    <a href="/settings" class="dropdown-item">
                        <i class="fas fa-cog"></i> Settings
                    </a>
                    <hr class="dropdown-divider">
                    <a href="/auth/logout" class="dropdown-item text-danger">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </div>
</nav>



{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/layouts/navbar.css') }}">
{% endblock %}
